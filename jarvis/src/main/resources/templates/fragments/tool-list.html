<!-- Platzhalter, bis das Frontend-Team die echten Templates baut. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="list" id="tool-list">
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <table>
    <tr><th>Name</th><th>Beschreibung</th><th>Aktiv</th><th>Bestätigung</th></tr>
    <tr th:each="t : ${tools}">
      <td th:text="${t.name}"></td>
      <td th:text="${t.description}"></td>
      <td th:text="${t.enabled}"></td>
      <td th:text="${t.requiresConfirmation}"></td>
    </tr>
  </table>
</div>
